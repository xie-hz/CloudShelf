# ============ 数据库配置 ============
spring.datasource.url=jdbc:mysql://mysql:3306/cloudshelf?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:cloudshelf123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============ Redis 配置 ============
spring.redis.host=redis
spring.redis.port=6379
spring.redis.database=0
spring.redis.jedis.pool.max-active=20
spring.redis.jedis.pool.max-wait=-1
spring.redis.jedis.pool.max-idle=10
spring.redis.jedis.pool.min-idle=0
spring.redis.timeout=2000

# ============ 文件存储路径（绝对路径） ============
project.folder=/app/data/

# ============ 邮件配置（按需修改） ============
spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.debug=true

# ============ 日志 ============
log.root.level=info

# ============ 管理员 ============
admin.emails=${ADMIN_EMAILS:admin@qq.com}

# ============ 其他 ============
dev=false